<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_1 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_1" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_1');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 1.2, 5.5);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
scene.add(ambientLight);

const mainLight = new THREE.DirectionalLight(0xffecd2, 2.5);
mainLight.position.set(4, 8, 5);
scene.add(mainLight);

const rimLight = new THREE.DirectionalLight(0x00754a, 3.5);
rimLight.position.set(-5, 4, -3);
scene.add(rimLight);

const goldLight = new THREE.PointLight(0xd4af37, 2.0, 10);
goldLight.position.set(2, -1, 3);
scene.add(goldLight);

// Group for the entire cup & floating elements
const group = new THREE.Group();
scene.add(group);

// Starbucks Cup materials
const cupBodyMat = new THREE.MeshPhongMaterial({
  color: 0x052a1a, // deep royal forest green
  shininess: 90,
  specular: 0xd4af37
});

const cupLidMat = new THREE.MeshPhongMaterial({
  color: 0x111614,
  shininess: 40
});

const sleeveMat = new THREE.MeshStandardMaterial({
  color: 0xd7b889, // kraft cardboard sleeve with gold hue
  roughness: 0.85,
  metalness: 0.1
});

const goldAccentMat = new THREE.MeshStandardMaterial({
  color: 0xd4af37,
  metalness: 0.9,
  roughness: 0.2
});

const coffeeLiquidMat = new THREE.MeshPhongMaterial({
  color: 0x2b1509,
  shininess: 100
});

// 1. Cup Body (Tapered Cylinder)
const cupGeom = new THREE.CylinderGeometry(0.9, 0.65, 2.2, 48, 1, false);
const cupMesh = new THREE.Mesh(cupGeom, cupBodyMat);
cupMesh.position.y = 0;
group.add(cupMesh);

// 2. Cup Sleeve (Kraft card)
const sleeveGeom = new THREE.CylinderGeometry(0.81, 0.73, 0.9, 48);
const sleeveMesh = new THREE.Mesh(sleeveGeom, sleeveMat);
sleeveMesh.position.y = 0.05;
group.add(sleeveMesh);

// 3. Siren Medallion Emblem on Sleeve
const medallionGeom = new THREE.CylinderGeometry(0.32, 0.32, 0.04, 32);
medallionGeom.rotateX(Math.PI / 2);
const medallionMesh = new THREE.Mesh(medallionGeom, goldAccentMat);
medallionMesh.position.set(0, 0.05, 0.78);
group.add(medallionMesh);

// Medallion inner green core
const coreGeom = new THREE.CylinderGeometry(0.25, 0.25, 0.05, 32);
coreGeom.rotateX(Math.PI / 2);
const coreMat = new THREE.MeshPhongMaterial({ color: 0x00754a });
const coreMesh = new THREE.Mesh(coreGeom, coreMat);
coreMesh.position.set(0, 0.05, 0.79);
group.add(coreMesh);

// Gold star in center
const starGeom = new THREE.ConeGeometry(0.08, 0.08, 5);
starGeom.rotateX(Math.PI / 2);
const starMesh = new THREE.Mesh(starGeom, goldAccentMat);
starMesh.position.set(0, 0.05, 0.83);
group.add(starMesh);

// 4. Cup Rim & Lid
const rimGeom = new THREE.TorusGeometry(0.91, 0.04, 16, 48);
rimGeom.rotateX(Math.PI / 2);
const rimMesh = new THREE.Mesh(rimGeom, cupLidMat);
rimMesh.position.y = 1.1;
group.add(rimMesh);

const lidGeom = new THREE.CylinderGeometry(0.92, 0.91, 0.28, 48);
const lidMesh = new THREE.Mesh(lidGeom, cupLidMat);
lidMesh.position.y = 1.25;
group.add(lidMesh);

const sipGeom = new THREE.BoxGeometry(0.35, 0.12, 0.2);
const sipMesh = new THREE.Mesh(sipGeom, cupLidMat);
sipMesh.position.set(0, 1.4, 0.7);
group.add(sipMesh);

// 5. Floating roasted coffee beans orbit
const beanGroup = new THREE.Group();
const beanMat = new THREE.MeshStandardMaterial({
  color: 0x3d2012,
  roughness: 0.6,
  metalness: 0.1
});

const beans = [];
const numBeans = 14;
for (let i = 0; i < numBeans; i++) {
  const bGeom = new THREE.SphereGeometry(0.12, 16, 12);
  bGeom.scale(1.4, 0.9, 0.7);
  const bean = new THREE.Mesh(bGeom, beanMat);
  const angle = (i / numBeans) * Math.PI * 2;
  const radius = 1.6 + Math.sin(i * 1.5) * 0.4;
  const y = (Math.random() - 0.5) * 2.2;
  bean.position.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
  bean.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
  bean.userData = { angle, radius, speed: 0.008 + (i % 3) * 0.004, yOffset: y };
  beanGroup.add(bean);
  beans.push(bean);
}
group.add(beanGroup);

// Floating golden aroma particles
const particleCount = 28;
const pGeom = new THREE.SphereGeometry(0.025, 8, 8);
const pMat = new THREE.MeshBasicMaterial({ color: 0xd4af37 });
const particles = [];
for (let i = 0; i < particleCount; i++) {
  const p = new THREE.Mesh(pGeom, pMat);
  p.position.set(
    (Math.random() - 0.5) * 2.5,
    Math.random() * 2.5 - 0.5,
    (Math.random() - 0.5) * 2.5
  );
  p.userData = { vy: 0.005 + Math.random() * 0.008, basePos: p.position.clone() };
  group.add(p);
  particles.push(p);
}

// Initial subtle tilt
group.rotation.x = 0.15;
group.rotation.y = -0.3;

// Mouse Interaction & Movement
let mouseX = 0;
let mouseY = 0;
let targetRotX = 0.15;
let targetRotY = -0.3;

function onMouseMove(e) {
  const rect = container.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width - 0.5;
  const y = (e.clientY - rect.top) / rect.height - 0.5;
  targetRotY = x * 1.8;
  targetRotX = -y * 1.2 + 0.15;
}

window.addEventListener('mousemove', onMouseMove);

// Animation Loop
let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  // Smooth lerp to mouse position
  group.rotation.y += (targetRotY - group.rotation.y) * 0.05;
  group.rotation.x += (targetRotX - group.rotation.x) * 0.05;

  // Gentle floating hover
  group.position.y = Math.sin(time * 1.5) * 0.08;

  // Animate orbiting coffee beans
  beans.forEach((bean) => {
    bean.userData.angle += bean.userData.speed;
    bean.position.x = Math.cos(bean.userData.angle) * bean.userData.radius;
    bean.position.z = Math.sin(bean.userData.angle) * bean.userData.radius;
    bean.position.y = bean.userData.yOffset + Math.sin(time * 2 + bean.userData.angle) * 0.12;
    bean.rotation.x += 0.015;
    bean.rotation.y += 0.02;
  });

  // Animate golden steam particles
  particles.forEach((p) => {
    p.position.y += p.userData.vy;
    if (p.position.y > 2.8) {
      p.position.y = 1.0;
      p.position.x = (Math.random() - 0.5) * 0.8;
      p.position.z = (Math.random() - 0.5) * 0.8;
    }
  });

  renderer.render(scene, camera);
}

animate();

function onWindowResize() {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}

window.addEventListener('resize', onWindowResize);

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_1 -->
</body>
</html>
